name: Release
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test:pack
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify the released tarball
        id: candidate
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-artifacts/agentbridge-*.tgz)
          if (( ${#packages[@]} == 0 )); then
            echo "No new release; no npm candidate."
            exit 0
          fi
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one released package" >&2
            exit 1
          fi
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]
          test "${packages[0]}" = "release-artifacts/agentbridge-$version.tgz"
          digest=$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.candidate.outputs.version != ''
        with:
          name: npm-candidate-${{ github.run_id }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
  npm-stage:
    needs: release
    if: needs.release.outputs.version != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-candidate-${{ github.run_id }}
          path: candidate/
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pinned npm CLI with staging support
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify and stage the tested release package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          DIST_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]
          if [[ "$DIST_TAG" == latest ]]; then
            [[ "$RELEASE_VERSION" != *-* ]]
          else
            [[ "$RELEASE_VERSION" == *-dev.* ]]
          fi
          package="./candidate/agentbridge-$RELEASE_VERSION.tgz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$package" | sha256sum --check -
          tar -xOf "$package" package/package.json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(0, "utf8"));
            if (manifest.name !== "agentbridge" ||
                manifest.version !== process.env.RELEASE_VERSION ||
                manifest.bin?.agentbridge !== "./dist/cli.js" ||
                manifest.repository?.url !== "git+https://github.com/vspdi/agentbridge.git") {
              throw new Error("Unexpected package identity");
            }
          '
          npm stage publish "$package" --tag "$DIST_TAG" --access public --ignore-scripts
          echo "Candidate staged. Review and approve it on npm with 2FA." >> "$GITHUB_STEP_SUMMARY"
