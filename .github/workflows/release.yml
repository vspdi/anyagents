name: Release
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test:pack
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify the released tarball
        id: candidate
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-artifacts/anyagents-*.tgz)
          if (( ${#packages[@]} == 0 )); then
            echo "No new release; no npm candidate."
            exit 0
          fi
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one released package" >&2
            exit 1
          fi
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]
          test "${packages[0]}" = "release-artifacts/anyagents-$version.tgz"
          digest=$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.candidate.outputs.version != ''
        with:
          name: npm-candidate-${{ github.run_id }}
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
  npm-stage:
    needs: release
    if: needs.release.outputs.version != '' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-candidate-${{ github.run_id }}
          path: candidate/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install the pinned npm CLI with staging support
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Stage release for manual npm approval
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sha256 }}
          DIST_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]]
          if [[ "$DIST_TAG" == latest ]]; then
            [[ "$RELEASE_VERSION" != *-* ]]
          else
            [[ "$RELEASE_VERSION" == *-dev.* ]]
          fi
          package="./candidate/anyagents-$RELEASE_VERSION.tgz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$package" | sha256sum --check -
          tar -xOf "$package" package/package.json | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync(0, "utf8"));
            if (manifest.name !== "anyagents" ||
                manifest.version !== process.env.RELEASE_VERSION ||
                manifest.bin?.anyagents !== "./dist/cli.js" ||
                manifest.repository?.url !== "git+https://github.com/vspdi/anyagents.git") {
              throw new Error("Unexpected package identity");
            }
          '
          npm stage publish "$package" --tag "$DIST_TAG" --access public --ignore-scripts --json > staged-package.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const response = JSON.parse(readFileSync('staged-package.json', 'utf8'));
          const candidate = response.anyagents;
          if (!candidate) throw new Error('Missing anyagents npm staging response');
          if (candidate.name !== 'anyagents' ||
              candidate.version !== process.env.RELEASE_VERSION ||
              !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(candidate.stageId)) {
            throw new Error('Unexpected npm staging response; inspect the staged package on npm');
          }
          const summary = [
            '## npm publication awaits your approval',
            '',
            `[Review and approve on npm](https://www.npmjs.com/package/anyagents) — open the **Staged Packages** tab.`,
            '',
            `Package: **anyagents@${candidate.version}**`,
            `Channel: **${process.env.DIST_TAG}**`,
            `Candidate ID: \`${candidate.stageId}\``,
            `SHA-256: \`${process.env.EXPECTED_SHA256}\``,
            '',
            'Review this candidate, then select **Approve** and complete npm 2FA when ready.',
            'This workflow only stages the package; it does not publish it publicly.',
            '',
            'Alternatively, with npm 12.2.0 or later:',
            '',
            '```sh',
            `npm stage view ${candidate.stageId}`,
            `npm stage download ${candidate.stageId}`,
            `npm stage approve ${candidate.stageId}`,
            '```',
            '',
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(`anyagents@${candidate.version} awaits npm approval (candidate ${candidate.stageId}).`);
          NODE
