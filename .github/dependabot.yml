version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: conventional-changelog-conventionalcommits
        versions: [">=10"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: dev
    commit-message:
      prefix: ci
      include: scope
